<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض إيفا | الكتالوج الرقمي</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fdf2f4; color: #333; margin: 0; padding: 15px; direction: rtl; }
        .header { text-align: center; padding: 20px; background: #fff; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header img { max-height: 70px; margin-bottom: 10px; }
        .notice-bar { background: #880e4f; color: #fff; padding: 10px 15px; border-radius: 8px; text-align: center; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        .categories-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .cat-btn { background: #fff; border: 1px solid #f8bbd0; color: #880e4f; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; white-space: nowrap; font-size: 13px; }
        .cat-btn.active { background: #880e4f; color: #fff; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #f8bbd0; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img-container { width: 100%; height: 220px; border-radius: 8px; overflow: hidden; background: #f9f9f9; position: relative; margin-bottom: 10px; cursor: pointer; }
        .product-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .product-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .product-code { font-size: 12px; color: #888; margin-bottom: 8px; }
        .product-price { font-size: 16px; font-weight: bold; color: #880e4f; margin-bottom: 12px; }
        .order-btn { background: #880e4f; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }
        .order-btn:hover { background: #ad1457; }
        .reserved-badge { background: #e74c3c; color: #fff; text-align: center; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-top: 10px; }
        
        /* Modal للتصوير والطلب */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: #fff; width: 100%; max-width: 450px; border-radius: 12px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .close-modal { float: left; font-size: 20px; font-weight: bold; color: #880e4f; cursor: pointer; }
        
        /* معرض الصور المصغر */
        .image-modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .image-modal img { max-width: 90%; max-height: 75vh; border-radius: 8px; object-fit: contain; }
        .close-img-modal { position: absolute; top: 20px; left: 25px; color: #fff; font-size: 30px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div id="logoContainer"><h1 style="color: #880e4f; margin:0;">معرض إيفا براند</h1></div>
        <p style="color: #666; font-size: 13px; margin: 5px 0 0 0;">أرقى العطور، الحقائب، والساعات الفاخرة</p>
        <div id="partnerBanner" style="display:none; margin-top: 10px; background: #fff0f5; padding: 8px; border-radius: 6px; font-size: 13px; color: #880e4f; font-weight: bold;"></div>
    </div>

    <div id="adminNoticeBar" class="notice-bar" style="display: none;"></div>

    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" onclick="filterCategory('ALL')">الكل</button>
    </div>

    <div class="products-grid" id="productsGrid">
        <p style="text-align:center; grid-column: 1/-1; color:#888;">جاري تحميل المنتجات...</p>
    </div>

    <!-- نافذة الطلب -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeOrderModal()">&times;</span>
            <h3 style="color: #880e4f; margin-top: 0; margin-bottom: 15px;">🛍️ إتمام طلب المنتج</h3>
            <p id="modalProductName" style="font-weight: bold; color: #333; margin-bottom: 15px; font-size: 14px;"></p>
            
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="clientName" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الهاتف (واتساب):</label>
                <input type="text" id="clientPhone" placeholder="0590000000">
            </div>
            <div class="form-group">
                <label>العنوان (المدينة / الحي):</label>
                <input type="text" id="clientAddress" placeholder="رام الله - المنارة">
            </div>
            
            <button class="order-btn" onclick="submitOrder()" style="margin-top: 10px;">إرسال وتأكيد الطلب 🌸</button>
        </div>
    </div>

    <!-- نافذة تكبير الصورة -->
    <div id="imageModal" class="image-modal">
        <span class="close-img-modal" onclick="closeImageModal()">&times;</span>
        <img id="modalFullImg" src="">
        <div id="imgThumbsContainer" style="display: flex; gap: 8px; margin-top: 15px; overflow-x: auto; max-width: 100%;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqPpKqqHBEIJZTCGCROFzqZyHOYlnDgP4",
            authDomain: "eva-plus-66b96.firebaseapp.com",
            projectId: "eva-plus-66b96",
            storageBucket: "eva-plus-66b96.firebasestorage.app",
            messagingSenderId: "686798536842",
            appId: "1:686798536842:web:8c09932cd5869292eb6d73"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let categoriesData = {};
        let selectedProductForOrder = null;
        let urlParams = new URLSearchParams(window.location.search);
        let partnerUser = urlParams.get('user'); // معرف الشريك إن وجد

        window.addEventListener('DOMContentLoaded', async () => {
            if (partnerUser) {
                try {
                    let pDoc = await getDoc(doc(db, "partners", partnerUser));
                    let banner = document.getElementById('partnerBanner');
                    if (pDoc.exists()) {
                        banner.style.display = 'block';
                        banner.innerHTML = `🌸 متجر برعاية الشريك المعتمد: ${pDoc.data().name} (${partnerUser})`;
                    } else {
                        partnerUser = null; // إذا لم يكن موجوداً يُعامل كزائر عادي
                    }
                } catch(e) { partnerUser = null; }
            }

            try {
                // تحميل اللوغو والإدارة
                const settingsSnap = await getDocs(collection(db, "settings"));
                settingsSnap.forEach(d => {
                    if(d.id === 'logo' && d.data().img) {
                        document.getElementById('logoContainer').innerHTML = `<img src="${d.data().img}" alt="Logo">`;
                    }
                    if(d.id === 'notice' && d.data().text) {
                        let bar = document.getElementById('adminNoticeBar');
                        bar.style.display = 'block';
                        bar.innerText = d.data().text;
                    }
                });

                // تحميل الأقسام
                const catSnap = await getDocs(collection(db, "categories"));
                let navHtml = `<button class="cat-btn active" onclick="filterCategory('ALL')">الكل</button>`;
                catSnap.forEach(d => {
                    categoriesData[d.id] = d.data().name;
                    navHtml += `<button class="cat-btn" onclick="filterCategory('${d.id}')">${d.data().name}</button>`;
                });
                document.getElementById('categoriesNav').innerHTML = navHtml;

                // تحميل المنتجات
                const prodSnap = await getDocs(collection(db, "products"));
                allProducts = [];
                prodSnap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));

                renderProducts(allProducts);

            } catch (err) {
                console.error("Error loading catalog:", err);
                document.getElementById('productsGrid').innerHTML = `<p style="text-align:center; color:red; grid-column:1/-1;">خطأ في تحميل المنتجات.</p>`;
            }
        });

        window.filterCategory = function(catId) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (catId === 'ALL') {
                renderProducts(allProducts);
            } else {
                renderProducts(allProducts.filter(p => p.category === catId));
            }
        };

        function renderProducts(products) {
            let grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p style="text-align:center; color:#888; grid-column:1/-1;">لا توجد منتجات متوفرة حالياً في هذا القسم.</p>`;
                return;
            }

            grid.innerHTML = products.map(p => {
                let firstImg = (p.images && p.images.length > 0) ? p.images[0] : '';
                let isReserved = p.reservedUntil && new Date(p.reservedUntil) > new Date();

                return `
                    <div class="product-card">
                        <div>
                            <div class="product-img-container" onclick='openImageModal(${JSON.stringify(p.images || [])})'>
                                <img src="${firstImg}" alt="${p.name}">
                            </div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-code">كود المنتج: ${p.code}</div>
                            <div class="product-price">${p.price} ₪</div>
                        </div>
                        <div>
                            ${isReserved ? 
                                `<div class="reserved-badge">محجوز حالياً</div>` : 
                                `<button class="order-btn" onclick='openOrderModal("${p.code}", "${p.name}")'>اطلب المنتج 🛍️</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openOrderModal = function(code, name) {
            selectedProductForOrder = { code, name };
            document.getElementById('modalProductName').innerText = `المنتج: ${name} (${code})`;
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientAddress').value = '';
            document.getElementById('orderModal').style.display = 'flex';
        };

        window.closeOrderModal = function() {
            document.getElementById('orderModal').style.display = 'none';
        };

        // إرسال الطلب (الفصل التام بين الزبون العادي وزبون أيفا بلس)
        window.submitOrder = async function() {
            let name = document.getElementById('clientName').value.trim();
            let phone = document.getElementById('clientPhone').value.trim();
            let address = document.getElementById('clientAddress').value.trim();

            if (!name || !phone || !address) {
                return alert('الرجاء إدخال كافة البيانات المطلوبة (الاسم، الهاتف، العنوان).');
            }

            try {
                let orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
                let reserveDate = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();

                // حجز المنتج مؤقتاً
                await setDoc(doc(db, "products", selectedProductForOrder.code), {
                    reservedUntil: reserveDate
                }, { merge: true });

                if (partnerUser) {
                    // 🌳 الحالة الثانية: طلب أيفا بلس (عبر رابط شريك)
                    await setDoc(doc(db, "orders", orderId), {
                        orderType: 'partner',
                        productCode: selectedProductForOrder.code,
                        productName: selectedProductForOrder.name,
                        clientName: name,
                        clientPhone: phone,
                        clientAddress: address,
                        sponsor: partnerUser, // الشريك صاحب الرابط
                        createdAt: new Date().toISOString()
                    });

                    alert('✅ تم إرسال طلبك بنجاح! سيتم التنسيق معك لتوصيل طلبك قريباً.');
                    closeOrderModal();
                    location.reload();

                } else {
                    // 🛍️ الحالة الأولى: طلب عادي (زائر مباشر بدون رابط شريك)
                    await setDoc(doc(db, "orders", orderId), {
                        orderType: 'normal',
                        productCode: selectedProductForOrder.code,
                        productName: selectedProductForOrder.name,
                        clientName: name,
                        clientPhone: phone,
                        clientAddress: address,
                        createdAt: new Date().toISOString()
                    });

                    // توجيه تلقائي وفوري للواتساب التجاري
                    let whatsappMsg = `مرحباً إيفا براند، أريد طلب المنتج رقم [${selectedProductForOrder.code}] - ${selectedProductForOrder.name}.\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}`;
                    let storeWhatsApp = "0597180456"; // رقم المعرض الأساسي
                    let waUrl = `https://wa.me/970${storeWhatsApp.replace(/^0/, '')}?text=${encodeURIComponent(whatsappMsg)}`;

                    closeOrderModal();
                    window.open(waUrl, '_blank');
                    location.reload();
                }

            } catch (err) {
                console.error("Error submitting order:", err);
                alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
            }
        };

        window.openImageModal = function(images) {
            if(!images || images.length === 0) return;
            document.getElementById('modalFullImg').src = images[0];
            let thumbs = document.getElementById('imgThumbsContainer');
            if(images.length > 1) {
                thumbs.innerHTML = images.map(img => `<img src="${img}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid #fff;" onclick="document.getElementById('modalFullImg').src='${img}'">`).join('');
                thumbs.style.display = 'flex';
            } else {
                thumbs.style.display = 'none';
            }
            document.getElementById('imageModal').style.display = 'flex';
        };

        window.closeImageModal = function() {
            document.getElementById('imageModal').style.display = 'none';
        };
    </script>
</body>
</html>
