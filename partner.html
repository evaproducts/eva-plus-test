<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الشريك | EVA PLUS</title>
    <style>
        :root {
            --primary-color: #880e4f;
            --secondary-color: #ad1457;
            --accent-color: #d4af37;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #fce4ec 100%);
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(136, 14, 79, 0.1);
            padding: 35px 30px;
            border: 1px solid rgba(248, 187, 208, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .brand-logo {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        .login-title {
            color: var(--primary-color);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        .input-with-icon {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--secondary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(173, 20, 87, 0.1);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(173, 20, 87, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(136, 14, 79, 0.4);
        }

        .login-footer-links {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .login-footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .login-footer-links a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        .brand-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- الشعار أو الأيقونة -->
            <img src="logo.jpg" alt="EVA PLUS" class="brand-logo" onerror="this.src='https://images.unsplash.com/photo-1513201099705-a9746e1e201f?auto=format&fit=crop&w=200&q=80'">
            
            <div class="login-title">🔐 بوابة الشركاء - EVA PLUS</div>
            <div class="login-subtitle">الرجاء إدخال رقم الشريك (اليوزر) وكلمة المرور الخاصة بحسابك للوصول إلى لوحة الأرباح والروابط.</div>

            <!-- نموذج تسجيل الدخول البرمجي (تم الحفاظ على المعرفات ودوال الـ JS كما هي تماماً) -->
            <div class="form-group">
                <label>رقم الشريك (اليوزر):</label>
                <input type="text" id="partnerIdInput" class="form-control" placeholder="مثال: EVA-491">
            </div>

            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="partnerPasswordInput" class="form-control" placeholder="أدخل كلمة المرور الخاصة بك">
            </div>

            <button type="button" onclick="loginPartner()" class="login-btn">
                دخول لوحة التحكم 🚀
            </button>

            <div class="login-footer-links">
                <a href="#" onclick="forgotPassword()">نسيت كلمة المرور؟</a>
                <a href="https://linky.ps/eva" target="_blank">linky.ps/eva 🌐</a>
            </div>
        </div>

        <div class="brand-footer">
            جميع الحقوق محفوظة © معرض إيفا براند - نظام EVA PLUS 2026
        </div>
    </div>

    <!-- كود الـ JavaScript البرمجي الأصلي دون أي تعديل في الوظائف لضمان سلامة العمل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqPpKqqHBEIJZTCGCROFzqZyHOYlnDgP4",
            authDomain: "eva-plus-66b96.firebaseapp.com",
            projectId: "eva-plus-66b96",
            storageBucket: "eva-plus-66b96.firebasestorage.app",
            messagingSenderId: "686798536842",
            appId: "1:686798536842:web:8c09932cd5869292eb6d73"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.loginPartner = async function() {
            let pId = document.getElementById('partnerIdInput').value.trim().toUpperCase();
            let pPass = document.getElementById('partnerPasswordInput').value.trim();

            if (!pId || !pPass) {
                alert('الرجاء إدخال رقم الشريك وكلمة المرور.');
                return;
            }

            try {
                let docRef = doc(db, "partners", pId);
                let docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    let data = docSnap.data();
                    let storedPass = (data.password || "").toString().trim();

                    if (storedPass === pPass) {
                        localStorage.setItem('eva_logged_partner', pId);
                        window.location.href = `partner_dashboard.html?user=${pId}`;
                    } else {
                        alert('⚠️ كلمة المرور غير صحيحة. يرجى المحاولة مرة أخرى.');
                    }
                } else {
                    alert('❌ رقم الشريك غير مسجل في النظام.');
                }
            } catch (err) {
                console.error("Login error:", err);
                alert('حدث خطأ أثناء تسجيل الدخول، يرجى المحاولة لاحقاً.');
            }
        };

        window.forgotPassword = function() {
            alert('للاسترجاع أو المساعدة، يرجى التواصل مع الإدارة المركزية لمعرض إيفا براند عبر الواتساب.');
        };
    </script>
</body>
</html>
